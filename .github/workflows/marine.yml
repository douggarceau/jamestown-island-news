name: Weather & Marine data
# Hourly: NOAA buoy and shore-station reports, Coast Guard notices near Jamestown and the
# Narragansett Bay coastal waters forecast text, saved to data/marine.json for the Weather & Marine tab.
# (Forecasts, alerts, tides and live wind load straight from NOAA in the reader's browser.)
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: marine
  cancel-in-progress: false
jobs:
  marine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect buoys, Coast Guard notices and marine forecast text
        run: python3 -I tools/marine/fetch_marine.py .
      - name: Publish if anything changed
        run: |
          git config user.name "marine-data"
          git config user.email "actions@users.noreply.github.com"
          git add data/marine.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weather & Marine data (automatic)"
          for i in 1 2 3; do (git pull --rebase -q || { git rebase --abort; false; }) && git push && exit 0; sleep 10; done
          exit 1
